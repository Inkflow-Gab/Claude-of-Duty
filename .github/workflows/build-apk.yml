name: Build APK

# READ-ONLY, MANUAL ORCHESTRATOR — THE PIPELINE LIVES IN THE WRAPPER REPO
#
# The APK pipeline (capacitor config, android-overrides/, the launcher icon and
# build-apk.sh) is owned by the sibling repository `Inkflow-Gab/black-of-duty-apk`
# — that is the single source of truth, and an APK built here is built by that
# repo's own script, cloned fresh on every run so it cannot drift from what the
# release builds ship.
#
# This file exists for one reason: so the game repo's Actions page can dispatch
# an APK build without knowing the wrapper repo exists. It is deliberately
# `workflow_dispatch` only:
#
#   - No push trigger. A mirrored pipeline that auto-runs on game pushes would
#     burn CI minutes for comment-only commits, and a push trigger here would
#     rerun the build twice (game repo + wrapper repo) with one result landing
#     in each Actions tab.
#   - No mirrored files. An earlier version of this repo carried its own copy of
#     build-apk.sh + capacitor.config.json; they could not run here (this repo
#     has no android-overrides/), they failed on every build-apk.sh sync push,
#     and they drifted from the wrapper. They are gone; the wrapper owns them.
#
# `ref` chooses which game commit to wrap — same input, same default, same build
# as the wrapper repo's workflow.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Game branch or commit to wrap
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    env:
      # A single slash. The game is built under wrapper/game with this BASE_PATH,
      # so the bundle never references the Pages subpath; build-apk.sh hard-fails
      # if it does (inside an APK the assets are served from the root).
      BASE_PATH: '/'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Capacitor 7's Android template uses source/target compatibility 21; the
      # runner default is 17. Same JDK the wrapper pipeline pins.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The wrapper is cloned as our workspace root, and the game goes INSIDE it
      # as `game/` — the exact layout build-apk.sh expects (its overrides are
      # referenced as `../android-overrides`, so the script must run from the
      # wrapper root with the game as a sibling directory).
      - name: Check out the wrapper pipeline and the game
        run: |
          git clone --depth 1 https://github.com/Inkflow-Gab/black-of-duty-apk.git wrapper
          git clone --depth 1 --branch "${{ github.event.inputs.ref || 'main' }}" \
            https://github.com/Inkflow-Gab/Claude-of-Duty.git wrapper/game
          echo "wrapped game commit: $(git -C wrapper/game rev-parse --short HEAD)"

      - name: Build the game
        working-directory: wrapper/game
        run: |
          npm ci
          NODE_ENV=production npx vite build
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }

      - name: Generate the Android project and apply patches
        # Runs the WRAPPER's script (not a copy of it) with its default GAME_DIR=game.
        working-directory: wrapper
        run: bash build-apk.sh

      - name: Build the debug APK
        working-directory: wrapper/game/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate the APK
        id: apk
        run: |
          APK=$(find wrapper/game/android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "no APK produced"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$APK" | cut -f1)"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: black-of-duty-debug-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### APK built (orchestrated)"
            echo
            echo "- game commit: \`$(git -C wrapper/game rev-parse --short HEAD)\`"
            echo "- platform: wrapper repo \`$(git -C wrapper rev-parse --short HEAD)\`"
            echo "- apk: \`${{ steps.apk.outputs.path }}\` (${{ steps.apk.outputs.size }})"
            echo
            echo "Download it from the Artifacts section of this run."
          } >> "$GITHUB_STEP_SUMMARY"